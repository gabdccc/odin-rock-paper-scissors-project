<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <div class="nav">
        <span>Rock Paper Scissors Game!</span>
      </div>
    </header>
    <main>
      <div class="scoreboard">
        <p class="playerScore">Placeholder</p>
        <p class="enemyScore">Placeholder</p>
      </div>
      <div class="ans">
        <div class="top">
          <span class="start">Press Start!</span>
        </div>
        <div class="butones">
          <button name="Rock" class="img">
            <img src="./imgs/rock.png" alt="Rock" />
          </button>
          <button name="Paper" class="img">
            <img src="./imgs/paper.png" alt="Paper" />
          </button>
          <button name="Scissors" class="img">
            <img src="./imgs/scissors.png" alt="Scissors" />
          </button>
        </div>
      </div>
      <div class="bottom"></div>
    </main>
    <script src="scripts.js"></script>
  </body>
</html>
